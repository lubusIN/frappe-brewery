name: Submit Frappe App
description: Submit your Frappe App to the registry
title: "App: [Your App Name]"
labels: ["[app]submission"]
body:
  - type: markdown
    attributes:
      value: "### Welcome to Frappe Brewery!\nHave an app you'd like to share? Submit the public GitHub repository URL and we'll do most of the heavy lifting.Our automated workflows will try to extract the metadata.\n\n**Note**:Frappe Brewery is a curated registry focused on quality applications and good ecosystem craftsmanship. We review submissions for usability, maintainability, documentation, and alignment with Frappe best practices."
  
  - type: input
    id: repository
    attributes:
      label: GitHub Repository
      description: "Must be a public GitHub repository (e.g. https://github.com/frappe/erpnext)"
      placeholder: "https://github.com/your-org/your-repo"
    validations:
      required: true
  
  - type: dropdown
    id: categories
    attributes:
      label: Categories
      description: "Select the categories that best describe your app."
      multiple: true
      options:
        - Accounting & Finance
        - Analytics & AI
        - Business & Operations
        - CRM & Support
        - Developer Tools
        - E-Commerce & Retail
        - Human Resources
        - Industry Specific
        - Marketing
        - Mobile
        - Website & Themes
        - Utilities
    validations:
      required: true
      
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Provide up to 4 comma-separated tags for your app (e.g. accounting, invoice, billing)."
      placeholder: "tag1, tag2, tag3"
    validations:
      required: true
      
  - type: input
    id: install_branches
    attributes:
      label: Install Branches
      description: "Optional: Manually provide the install branches mapping. Format as comma-separated version:branch pairs (e.g. 14:version-14, 15:main). If left blank, we will attempt to auto-extract this from your repository."
      placeholder: "14:version-14, 15:main"
    validations:
      required: false
      
  - type: input
    id: screenshot
    attributes:
      label: Main Screenshot URL
      description: "Provide a direct URL to a screenshot of your app (e.g., https://example.com/screenshot.png). You can also just drag and drop an image into an empty GitHub issue to upload it, and paste the generated URL here."
      placeholder: "https://..."
    validations:
      required: true
