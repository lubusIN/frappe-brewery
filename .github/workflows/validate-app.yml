name: Validate App Submission

on:
  pull_request:
    paths:
      - "apps/**/*.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate registry data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: apps/**/*.json

      - name: Validate app JSON files
        run: |
          set +e
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            NO_COLOR=1 npm run brewery:validate ${{ steps.changed-files.outputs.all_changed_files }} > validation.log 2>&1
          else
            NO_COLOR=1 npm run brewery:validate > validation.log 2>&1
          fi
          exit_code=$?
          set -e
          
          echo "VALIDATION_EXIT_CODE=$exit_code" >> $GITHUB_ENV
          cat validation.log

      - name: Comment PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$VALIDATION_EXIT_CODE" -eq 0 ]; then
            echo "### ✅ Validation Passed" > comment.md
          else
            echo "### ❌ Validation Failed" > comment.md
          fi
          echo "" >> comment.md
          echo "\`\`\`" >> comment.md
          cat validation.log >> comment.md
          echo "\`\`\`" >> comment.md
          
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      - name: Fail on validation error
        if: env.VALIDATION_EXIT_CODE != '0'
        run: exit 1
