name: Validate App Submission

on:
  pull_request:
    paths:
      - "apps/**/*.json"
      - "schema/**/*.json"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate registry data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate app JSON files
        run: npm run validate
