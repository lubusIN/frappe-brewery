name: Sync Issue Categories

on:
  push:
    branches:
      - main
    paths:
      - "scripts/app.schema.json"

permissions:
  contents: write

concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Categories to Issue Template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Sync Script
        run: npm run brewery:sync

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync issue categories from schema [skip ci]"
          file_pattern: ".github/ISSUE_TEMPLATE/submit-app.yml"
