name: Accept App Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  accept:
    if: github.event.label.name == '[app]accepted' && contains(github.event.issue.labels.*.name, '[app]submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Accept Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx scripts/accept-issue.ts

      - name: Format Apps
        run: npm run brewery:validate || echo "Validation failed but proceeding"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add new app from issue #${{ github.event.issue.number }}"
          title: "Add App: Issue #${{ github.event.issue.number }}"
          body: "Automatically generated pull request from accepted app submission #${{ github.event.issue.number }}."
          branch: "add-app-${{ github.event.issue.number }}"
          delete-branch: true
