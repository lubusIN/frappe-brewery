name: Build Registry Index

on:
  push:
    branches:
      - main
    paths:
      - "apps/**/*.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  build-index:
    name: Generate index files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Validate all apps
        run: npm run brewery:validate

      - name: Generate index
        run: npm run brewery:build

      - name: Commit generated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update registry index [skip ci]"
          file_pattern: "index/*.json"
