name: Accept App Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-acceptance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  accept:
    if: github.event.label.name == '[app]accepted' && contains(github.event.issue.labels.*.name, '[app]submission')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Fetch issue comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > issue-comments.json

      - name: Accept Issue
        run: npx tsx scripts/accept-issue.ts

      - name: Format and Validate
        run: |
          npm run brewery:format
          if ! npm run brewery:validate; then
            echo "::warning::Validation failed — please review the app JSON before merging the PR."
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add new app from issue #${{ github.event.issue.number }}"
          title: "${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: "Automatically generated pull request from accepted app submission.\n\nCloses #${{ github.event.issue.number }}"
          branch: "add-app-${{ github.event.issue.number }}"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "### 🚀 App Accepted!

          A pull request has been automatically created to add this app to the registry! You can track its progress here: ${{ steps.cpr.outputs.pull-request-url }}"
